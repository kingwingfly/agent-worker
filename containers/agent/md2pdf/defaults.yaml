# Pandoc settings for md2pdf. GitHub-flavoured Markdown in, PDF out, typeset by Typst.
#
# A line break in the Markdown is a line break in the PDF, as in a chat window. Strict
# Markdown would join the lines, which turns an address block into one run-on line.
from: gfm+hard_line_breaks
pdf-engine: typst
filters:
  - ${.}/tidy.lua
include-in-header:
  - ${.}/header.typ
variables:
  papersize: a4
  fontsize: 11pt
  page-numbering: "1"
  linkcolor: "1a5fb4"
  margin:
    x: 2.2cm
    y: 2.4cm
